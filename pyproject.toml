[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh_auth_analyzer"
version = "0.1.0"
description = "Find source-level SSH authentication bursts and successful logins after failure clusters."
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Ahmed Areeb"}]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Information Technology", "Topic :: Security"]

[project.scripts]
ssh-auth-analyze = "tool:main"

[tool.setuptools]
py-modules = ["tool"]
